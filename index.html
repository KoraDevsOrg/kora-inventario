<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kora Inventario & Recetas</title>
  <link rel="stylesheet" href="css/styles.css">
  <!-- SDK universal de sincronización Kora -->
  <script src="https://cdn.jsdelivr.net/gh/KoraDevsOrg/kora-web-sdk@main/kora-sync.js"></script>
</head>
<body>

  <!-- Backdrop accesible del Drawer -->
  <div id="drawerBackdrop" class="drawer-backdrop"></div>

  <!-- Menú Hamburguesa Lateral -->
  <aside id="sideDrawer" class="side-drawer">
    <div class="drawer-header">
      <h2 style="font-size: 1.1rem; font-weight: 800;">Kora Negocios</h2>
      <button id="btnCloseDrawer" class="btn-hamburger" aria-label="Cerrar menú">✕</button>
    </div>

    <nav class="drawer-list">
      <button class="drawer-item" data-view="items">📦 Insumos y Productos</button>
      <button class="drawer-item" data-view="recipes">🥣 Fórmulas y Recetas</button>
      <button class="drawer-item" data-view="item-form">➕ Registrar Material</button>
      <button class="drawer-item" data-view="recipe-form">📐 Crear Escandallo Lote</button>
    </nav>
  </aside>

  <!-- Encabezado Principal -->
  <header>
    <div class="header-left">
      <button id="btnOpenDrawer" class="btn-hamburger" aria-label="Abrir menú">☰</button>
      <h1 style="font-size: 1.1rem; font-weight: 800;">Kora Inventario</h1>
    </div>
    <div class="offline-badge">100% Offline</div>
  </header>

  <!-- Barra de Pestañas Superiores -->
  <nav class="tab-bar">
    <button id="tabNavItems" class="tab-nav-btn active">1. Insumos y Existencias</button>
    <button id="tabNavRecipes" class="tab-nav-btn">2. Recetas (Escandallo)</button>
  </nav>

  <!-- Contenedor Único Dinámico (#app) -->
  <main id="appMainContent"></main>

  <footer>
    <span>Kora Negocios Populares • Cero Anuncios • Licencia MIT</span>
  </footer>

  <!-- Controlador Modular (MVC) -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
